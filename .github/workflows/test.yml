name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rspec:
    name: rspec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      # Parsanol ships a precompiled native extension for x86_64 Linux;
      # fail instead of skipping the native-engine examples if it is missing.
      AMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: gem build amath.gemspec

  artifacts:
    name: artifacts (compile --determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the Parsanol version that compiled the committed artifact
        run: echo "PARSANOL_VERSION=$(awk '/^compiler_version /{print $2}' artifacts/asciimath.checksums.txt)" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec ruby scripts/compile.rb --determinism
      - name: Committed grammar and artifacts match the regeneration
        run: git diff --exit-code -- grammars artifacts
