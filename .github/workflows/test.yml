name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rspec:
    name: rspec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      # Parsanol ships a precompiled native extension for x86_64 Linux;
      # fail instead of skipping the native-engine examples if it is missing.
      AMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: gem build amath.gemspec
