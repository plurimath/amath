name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      # Parsanol ships a precompiled native extension for x86_64 Linux;
      # fail instead of skipping the native-engine examples if it is missing.
      AMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The asciimath stage rows (generation 2) the raw-tree parity spec
      # compares with (spec/amath/testsuite_parity_spec.rb).
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: fac69501e826d6bc140ca02e37bd70333cefd988
          path: tmp/plurimath-testsuite
          persist-credentials: false
      - run: bundle exec rspec
        env:
          AMATH_TESTSUITE: ${{ github.workspace }}/tmp/plurimath-testsuite
      - run: gem build amath.gemspec
      # The registry v2 file and its pinned dialect L edition, and the
      # reserved-word collision check against the registry and unitsdb.
      - run: ruby scripts/registry.rb --check
      # The pma quantity names, generated from the pinned unitsdb.
      - run: bundle exec ruby scripts/quantities.rb --check
      - run: bundle exec ruby scripts/check_reserved_words.rb
      # The model classes and their LML export are generated from the
      # normalized grammar; both must match a fresh generation.
      - name: Generated model and LML export are current
        run: bundle exec ruby scripts/generate_model.rb --check
      # Regeneration step for the asciimath stage payloads in
      # plurimath-testsuite: the corpus must turn into the same raw trees on
      # both engines, and twice into the same bytes.
      - name: Generate the testsuite stage payloads from corpora/
        run: |
          bundle exec ruby scripts/generate_stage_cases.rb --out "$RUNNER_TEMP/stage-a"
          bundle exec ruby scripts/generate_stage_cases.rb --out "$RUNNER_TEMP/stage-b"
          diff -r "$RUNNER_TEMP/stage-a" "$RUNNER_TEMP/stage-b"
      # The same for the typed-model payloads (Amath.parse): the bound data
      # and the built model must give the same rows on both engines.
      - name: Generate the testsuite typed-model payloads from corpora/
        run: |
          bundle exec ruby scripts/generate_stage_cases.rb --boundary typed-model --out "$RUNNER_TEMP/model-a"
          bundle exec ruby scripts/generate_stage_cases.rb --boundary typed-model --out "$RUNNER_TEMP/model-b"
          diff -r "$RUNNER_TEMP/model-a" "$RUNNER_TEMP/model-b"

  artifacts:
    name: artifacts (compile --determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The artifact records the Parsanol version that compiled it and the
      # Ruby whose Onigmo Unicode tables it embeds; regenerate with both.
      - name: Use the Parsanol and Ruby versions that compiled the committed artifact
        run: |
          echo "PARSANOL_VERSION=$(awk '/^compiler_version /{print $2}' artifacts/asciimath.checksums.txt)" >> "$GITHUB_ENV"
          echo "ARTIFACT_RUBY=$(jq -r .unicode_tables artifacts/asciimath.json | sed -E 's/.*Ruby ([0-9.]+)\)$/\1/')" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.ARTIFACT_RUBY }}
          bundler-cache: true
      - run: bundle exec ruby scripts/compile.rb --determinism
      - name: Committed grammar and artifacts match the regeneration
        run: git diff --exit-code -- grammars artifacts
